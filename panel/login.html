<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>登录 · page工作台 · free-llm-router</title>
<!-- 字体：Inter + JetBrains Mono（Google Fonts，display=swap；加载失败时系统字体兜底，页面不受影响） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body class="login-body">
<!-- 液态玻璃透镜（与 index.html 同一套；glass.js 生成位移图） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="lg-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feImage id="lensMap" result="map" preserveAspectRatio="none"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="-300" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div class="aurora" aria-hidden="true"></div>
<div class="login-card">
  <img class="brand-mark" src="logo.png" alt="小pa">
  <h1>page工作台</h1>
  <p class="hint">请输入 API 密钥以进入管理面板。</p>

  <form id="login-form" autocomplete="off">
    <input id="apikey" type="password" placeholder="API 密钥" autocomplete="current-password" autofocus>
    <button type="submit" id="login-btn">登录</button>
  </form>

  <p id="login-msg" class="login-msg"></p>

  <p class="hint login-foot">
    密钥在阿里云 FC 函数的环境变量里设置（<code>API_KEY</code>）。<br>
    它只存在本机浏览器（localStorage），每个请求以 <code>Authorization</code> 头发送。
  </p>
</div>

<script src="glass.js?v=1"></script>
<script src="login.js?v=2"></script>
</body>
</html>
